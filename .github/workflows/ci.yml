name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test --all-targets
      - run: cargo bench --no-run
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      # `rust-version` is a published guarantee: lib and tests build
      # and pass on the minimum toolchain (clippy/fmt stay on stable).
      - run: cargo test --all-targets

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # Regenerates zig-golden.db from pinned xitdb (Zig, the primary
      # implementation), rewrites rust-golden.db, and reverse-verifies
      # the Rust file with Zig. Fails if either direction drifts.
      # (Regenerated files differ in random commit ids by design, so this
      # gates on the checks passing, not on byte identity.)
      - run: bash scripts/gen-fixtures.sh
      - run: cargo test --test compat
